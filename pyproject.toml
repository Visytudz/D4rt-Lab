[project]
name = "d4rt-lab"
version = "0.1.0"
description = "A Hydra and Lightning research implementation of D4RT"
readme = "README.md"
requires-python = ">=3.10, <3.11"
dependencies = [
    "huggingface-hub>=1.23.0",
    "hydra-core==1.3.2",
    "imageio==2.37.3",
    "lightning>=2.5,<2.6",
    "lz4==4.4.5",
    "matplotlib==3.10.8",
    "numpy==2.2.5",
    "opencv-python-headless==4.13.0.92",
    "pillow==12.1.1",
    "pyyaml==6.0.3",
    "tensorboard==2.20.0",
    "torch==2.6.0+cu124",
    "torchvision==0.21.0+cu124",
    "tqdm==4.67.3",
]

[project.scripts]
d4rt-train = "d4rt_lab.cli.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["d4rt_lab*"]


[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
