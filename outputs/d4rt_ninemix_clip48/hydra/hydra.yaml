hydra:
  run:
    dir: ${experiment.output_dir}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task: []
  job:
    name: train
    chdir: false
    override_dirname: ''
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/zgw/Project/D4rt-Lab
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/zgw/Project/D4rt-Lab/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/zgw/Project/D4rt-Lab/outputs/d4rt_ninemix_clip48
    choices:
      system: train
      system/experiment@experiment: d4rt_48
      system/schedule@schedule: cosine_30k
      system/optimizer@optimizer: adamw
      system/runtime@runtime: eight_gpu
      system/logging@logging: default
      system/checkpoint@checkpoint: default
      loss: d4rt
      data: ninemix_clip48
      data/dataset@data.mvs_synth: mvs_synth
      data/dataset@data.co3d: co3d
      data/dataset@data.blendermvs: blendermvs
      data/dataset@data.scannet: scannet
      data/dataset@data.virtual_kitti2: virtual_kitti2
      data/dataset@data.tartanair: tartanair
      data/dataset@data.kubric_full: kubric
      data/dataset@data.dynamic_replica: dynamic_replica
      data/dataset@data.pointodyssey: pointodyssey
      data/dataloader@dataloader: default
      data/augmentation@augmentation: none
      model: d4rt_vit_g_48
      model/initialization@initialization: d4rt_48init
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
