# @package _global_

defaults:
  - augmentation: none
  - dataloader: default
  - dataset@data.pointodyssey: pointodyssey
  - dataset@data.dynamic_replica: dynamic_replica
  - dataset@data.kubric_full: kubric
  - dataset@data.tartanair: tartanair
  - dataset@data.virtual_kitti2: virtual_kitti2
  - dataset@data.scannet: scannet
  - dataset@data.blendermvs: blendermvs
  - dataset@data.co3d: co3d
  - dataset@data.mvs_synth: mvs_synth
  - _self_

data:
  clip_frames: 48
  image_size:
  - 256
  - 256
  bad_sample_registry:
    path: datasets/meta/bad_sample.json
    max_retries: 64
  train_sources:
  - pointodyssey
  - dynamic_replica
  - kubric_full
  - tartanair
  - virtual_kitti2
  - scannet
  - blendermvs
  - co3d
  - mvs_synth
  val_sources:
  - pointodyssey
  - dynamic_replica
  - kubric_full
  - tartanair
  - virtual_kitti2
  - scannet
  sampling_weights:
    pointodyssey: 1.0
    dynamic_replica: 1.2
    kubric_full: 0.8
    tartanair: 1.6
    virtual_kitti2: 1.2
    scannet: 1.3
    blendermvs: 1.8
    co3d: 1.3
    mvs_synth: 1.2
train_sampling:
  queries_per_clip: 4096
  hard_query_ratio: 0.2
  hard_query_source: depth_and_motion_boundaries_sobel
  timestep_sampling:
    t_src: uniform
    t_tgt: uniform
    t_cam: uniform
    prob_t_tgt_equals_t_cam: 0.4
    t_src_tgt_delta_mode: static_local_global
